# jllm-web application settings. The engine settings (backend, context length, sampling defaults, ...) are the
# ones of jllm.properties and are edited in the console's Settings tab; they are stored in jllm.web.settings-file.
spring.application.name=jllm-web
server.port=8090
# the management API can load models and delete files: keep it on loopback unless jllm.web.api-key is set
server.address=127.0.0.1
spring.threads.virtual.enabled=true
# generation can take minutes: no async timeout for the streaming responses
spring.mvc.async.request-timeout=-1
server.compression.enabled=false

# where the engine settings changed in the UI are kept
jllm.web.settings-file=jllm-web.properties
# when set, /v1/** and /api/** require "Authorization: Bearer <key>"
jllm.web.api-key=
# models to load at startup, comma separated (links, owner/name, owner/name:Q4_K_M or local .gguf paths)
jllm.web.autoload=
# more folders whose models the Models page lists and loads in place, besides the engine's model.dir (comma
# separated, relative to the working directory; missing ones are skipped): ../models is the repository's folder
jllm.web.model-dirs=../models
jllm.web.log-lines=2000

logging.pattern.console=%d{HH:mm:ss.SSS} %5p %-30.30logger{29} : %m%n

# audio uploads of /v1/audio/transcriptions (the real limit is the engine setting audio.max-upload-mb)
spring.servlet.multipart.max-file-size=4GB
spring.servlet.multipart.max-request-size=4GB
