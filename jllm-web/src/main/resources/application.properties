# jllm-web application settings. The engine settings (backend, context length, sampling defaults, ...) are the
# ones of jllm.properties and are edited in the console's Settings tab; they are stored in jllm.web.settings-file.
spring.application.name=jllm-web
server.port=8090
# the management API can load models and delete files: keep it on loopback unless jllm.web.api-key is set
server.address=127.0.0.1
spring.threads.virtual.enabled=true
# generation can take minutes: no async timeout for the streaming responses
spring.mvc.async.request-timeout=-1
# The console's own files (HTML, CSS, JavaScript: about 465 kB in 25 files) are compressed for a browser that is
# not on this machine (to under a third). Only these content types: the event streams (text/event-stream), the
# JSON of the API and the generated pictures, clips and audio are sent as they are, so a token is never held back
# in a compression buffer.
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,text/javascript,application/javascript
server.compression.min-response-size=2048
# The browser keeps the console's files but asks whether they changed before using them (a 304 without a body
# when they did not). Without this header a browser decides by itself how long a file stays fresh, and after an
# upgrade it could run a new chat.js against an old markdown.js.
spring.web.resources.cache.cachecontrol.no-cache=true

# where the engine settings changed in the UI are kept
jllm.web.settings-file=jllm-web.properties
# when set, /v1/** and /api/** require "Authorization: Bearer <key>"
jllm.web.api-key=
# models to load at startup, comma separated (links, owner/name, owner/name:Q4_K_M or local .gguf paths)
jllm.web.autoload=
# more folders whose models the Models page lists and loads in place, besides the engine's model.dir (comma
# separated, relative to the working directory; missing ones are skipped): ../models is the repository's folder
jllm.web.model-dirs=../models
jllm.web.log-lines=2000

logging.pattern.console=%d{HH:mm:ss.SSS} %5p %-30.30logger{29} : %m%n

# Multipart uploads: the audio of /v1/audio/transcriptions, the picture and the mask of /v1/images/edits. One
# limit for both (a key may appear only once in this file: the last one wins), so it is only a ceiling; the real
# limits are engine settings that the endpoints check: audio.max-upload-mb and vision.max-image-bytes.
spring.servlet.multipart.max-file-size=4GB
spring.servlet.multipart.max-request-size=4GB
