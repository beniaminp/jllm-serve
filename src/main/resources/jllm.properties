# jllm-serve default configuration.
#
# Precedence (lowest to highest):
#   1. this file (bundled in the jar / target/classes)
#   2. an external properties file: --config <path>, or $JLLM_CONFIG, or ./jllm.properties if it exists
#   3. command line flags, e.g. --ctx 2048, --model Qwen/Qwen3-4B, or any key directly: --server.port 9000
#
# Every key below can be overridden at any of those levels.

# ---------------------------------------------------------------- model
# Hugging Face repository and revision to load
model.repo=Qwen/Qwen3-0.6B
model.revision=main
# where models are stored: <model.dir>/<repo with '/' replaced by '_'>
model.dir=models
# weight quantization for the linear layers: q4 (Q4_0), q8 (Q8_0), q2k (Q2_K, 2.625 bits/weight, for large
# models; visibly lossy below ~7B) or q6k (Q6_K, 6.5625 bits/weight, near-lossless)
model.quant=q4
# format of the embedding and the LM head: q8 (Q8_0, 8.5 bits/weight, the default) or q6k (Q6_K, 6.5625
# bits/weight: a quarter smaller, and the head is read in full for every decoded token). The head format is part of
# the cache name (jllm-q4_0-h6k.bin for q6k), so changing it converts a separate cache and leaves the other intact
model.head-quant=q8
# download, quantize and delete safetensors shards one at a time (for checkpoints larger than free disk)
model.low-disk=false
# GGUF: a repository of llama.cpp .gguf files (e.g. Qwen/Qwen3-0.6B-GGUF) or a local path (--model /path/model.gguf)
# is loaded as it is, without conversion: the file is memory-mapped and the kernels read its quantized blocks in
# place (Q4_0, Q4_1, Q5_0, Q5_1, Q8_0, Q2_K, Q3_K, Q4_K, Q5_K, Q6_K, IQ4_NL, IQ4_XS, MXFP4, F16, BF16; F32 matrices are
# converted to Q8_0 at load, as are the types named in -Djllm.gguf.requantize=Q4_1,... / all, to compare with that
# older behaviour; with the CPU backend Q5_1, Q3_K, F16 and BF16 are converted by default because their in-place decode is
# slower, -Djllm.gguf.requantize=none keeps them in place). model.quant does not apply.
# Pick the file of a repository by exact name ...
model.gguf-file=
# ... or by the quantization label in its name (Q4_K_M, Q8_0, ...). With neither, a repository with several .gguf
# files is an error that lists them. Only the chosen file (and its -0000i-of-0000N siblings) is downloaded.
model.gguf-quant=

# ---------------------------------------------------------------- vision (docs/20)
# Vision-language GGUF models (SmolVLM, Qwen2.5-VL, Qwen3-VL, Gemma 3, ...) see pictures through a second file, the
# multimodal projector (mmproj-*.gguf). model.mmproj names it: a path, or the name of a file next to the model / in
# its Hub repository. Empty = look for mmproj*.gguf next to the model file, and in the model's repository.
model.mmproj=
# false = never load a projector (text only, even when one is next to the model)
vision.enabled=true
# when the model's Hub repository has a projector and none is on disk, download it (the F16 one, else Q8_0)
vision.auto-download=true
# where the vision encoder runs: cpu | metal | auto (metal on macOS when the library is available)
vision.backend=auto
# image token budget for dynamic-resolution models (Qwen-VL; SmolVLM tiles): 0 = the model's own limit. A picture is
# resized so that it takes at least min and at most max tokens; fewer tokens = faster and less context
vision.image-min-tokens=0
vision.image-max-tokens=0
# megabytes of encoded pictures kept for the next turns of a conversation (re-encoding costs more than the answer)
vision.cache-mb=256
# refused when larger: an uploaded or downloaded picture file (bytes) and its decoded size (pixels)
vision.max-image-bytes=33554432
vision.max-image-pixels=100000000
# chat requests may name a picture by http(s) URL; the server fetches it, but not from loopback / private-network /
# link-local addresses unless this is true (the same rule as the console's fetch_url tool). data: URLs always work
vision.allow-private-urls=false

# ---------------------------------------------------------------- backend
# cpu | metal | auto (auto = metal on macOS when libjllm_metal.dylib is available, else cpu)
backend=auto
# context length = KV cache capacity in tokens per slot (memory: layers * ctx * kvDim * 8 bytes at f32, 4 bytes at f16).
# auto = sized from the memory free for the KV caches (docs/10 section 10.13): on Metal 60 % of the recommended working
# set that the weights and the other loaded models leave, on the CPU backends 60 % of the free Java heap (JLLM_XMX),
# both bounded by the physical memory; at most backend.ctx-max and the model's max_position_embeddings, at least 4096
# when the model has no smaller training length and the memory allows; logged at load ("Context: ..."). A number
# overrides (older versions had 4096).
backend.ctx=auto
# the most backend.ctx=auto picks (agents need 32k - 128k; a model trained for 1M tokens would otherwise ask for the
# whole memory); does not limit a number given in backend.ctx
backend.ctx-max=131072
# KV cache element type: f32 (exact, the default), f16 (halves KV cache memory and attention read traffic;
# K/V are rounded once to half precision when stored, the attention math stays f32 - a tiny precision loss),
# q8 (int8 with a scale per head row: about a quarter of f32) or q4 (Hadamard-rotated keys, 4-bit groups of 32 with a
# half scale: about an eighth of f32, for long contexts; see backend.kv-q4-recent)
backend.kv-dtype=f32
# q4 KV cache: the latest positions kept in half precision besides their 4-bit rows (0 = none); a query reads its
# nearest keys, which carry most of the attention, exactly
backend.kv-q4-recent=128
# prefill chunk size: tokens per forward() call while processing the prompt. auto = 256 for mixture-of-experts
# models (a chunk reads each chosen expert's weights once for all its tokens, so bigger chunks make MoE prefill
# cheaper per token; CPU experts measured 1.6x faster at 256 than at 64) and for dense decoders on Metal (a 64-token
# chunk leaves the GPU under-filled), 64 otherwise. A number overrides.
backend.batch=auto
# CPU worker threads, 0 = number of available processors
backend.threads=0
# explicit path to libjllm_metal.dylib (empty = search target/native, ./, next to the jar, -Djllm.metal.lib)
backend.metal.lib=
# Metal, mixture-of-experts models: routed experts that stay in CPU memory and run on the CPU (the GPU runs
# everything else). auto = just enough to fit Metal's recommended working set (nothing when the model fits, so
# nothing changes for models that fit), chosen from the usage counted in earlier runs so the rarely used experts go
# to the CPU and the hot ones stay on the GPU (whole layers until statistics exist); off; all; or a number of whole
# MoE layers (the last ones). The budget covers the whole device: every slot of a server and other loaded models.
# For models larger than the GPU may keep resident, which otherwise page on every token. Uses backend.threads and
# backend.cpu.int8-activations.
backend.metal.cpu-moe=auto
# CPU decode matmuls: quantize the activation vector to int8 per 32-block and use integer dot products
# (llama.cpp's q4_0 x q8_0 scheme) instead of dequantizing weights to float; ~0.4 % per-element activation
# rounding error, several times faster on 128-bit SIMD. false = float activations (bit-identical to earlier versions).
# auto = time both on the loaded model once and keep the faster (int8 wins on ARM NEON; on AVX-512 without VNNI the
# float kernels can be faster)
backend.cpu.int8-activations=auto
# int8 decode dot products in the native library libjllm_cpu (scripts/build-native-cpu.sh; docs/07 section 7.16):
# the CPU's byte dot-product instructions (x86 AVX512-VNNI / AVX-VNNI / AVX2, ARM dotprod / NEON), which the Java
# kernels cannot use. auto = use it when the library is found and passes its self-check against the Java kernels,
# else the Java kernels (logged); true = require it (fail without it); false = the Java kernels.
# Only matters when int8 activations are on (and for the auto probe above, which then times the native kernels).
backend.cpu.native=auto
# explicit path to libjllm_cpu.so / .dylib (empty = -Djllm.cpu.nativeLib, $JLLM_CPU_NATIVE_LIB, target/native, ./,
# native/ next to the jar)
backend.cpu.native-lib=

# ---------------------------------------------------------------- sampling defaults
# used by `run`, `chat`, `bench` and as the server's defaults when a request omits a field
# 0 = greedy
sampling.temperature=0.6
# 0 = disabled
sampling.top-k=20
# 1 = disabled
sampling.top-p=0.95
# 0 = disabled; keeps tokens with p >= min-p * p_max
sampling.min-p=0
# 1 = disabled
sampling.repetition-penalty=1.0
sampling.presence-penalty=0
sampling.frequency-penalty=0
# -1 = random
sampling.seed=-1
sampling.max-tokens=1024

# ---------------------------------------------------------------- chat / run
# Qwen3 thinking mode (<think>...</think> before the answer)
chat.thinking=false
# optional system prompt for `chat`
chat.system=

# ---------------------------------------------------------------- server
server.host=127.0.0.1
server.port=8080
# socket read timeout while waiting for a request / its body (0 = none). It bounds each read, and a whole
# request (headers and body) must also arrive within this time of its first byte, else 408: a client trickling
# bytes cannot hold a connection open. Put a buffering reverse proxy in front for slow links or large uploads.
server.read-timeout-ms=30000
# a streaming client that stops reading: generated chunks queue up for at most this long, then the connection
# is dropped and its generation cancelled, so one stalled client cannot hold the engine (0 = wait forever)
server.write-timeout-ms=10000
# maximum simultaneous connections; further connections wait in the accept queue
server.max-connections=256
# largest accepted request body
server.max-body-bytes=4194304
# how long a request may wait for the engine (other requests run one at a time) before a 503
server.queue-timeout-ms=60000
# wall-clock limit for one request's generation, 0 = unlimited; exceeded = finish_reason "length"
server.request-timeout-ms=0
# value for Access-Control-Allow-Origin, e.g. * or https://app.example.com; empty = no CORS headers
server.cors-origin=

# ---------------------------------------------------------------- engine
# reject prompts larger than this many bytes before tokenizing; 0 = backend.ctx * 16
engine.max-prompt-bytes=0
# several slots of one model (jllm-web) decode together: the next tokens of all the conversations generating at the
# same time come out of one forward pass, so the weights are read once for all of them (CPU backend; other backends
# run the steps one by one). false = each slot decodes on its own
engine.batch-decode=true
# request priority (docs/10 section 10.14): a request may say "priority": "background" (or send the header
# X-Jllm-Priority: background) when it is a subagent or a batch job rather than a person waiting. true = a background
# request does not take the device (prefill chunk, verification pass, decode batch) while an interactive one waits for it
# (it gives way for at most 2 s, so it cannot starve); no running pass is interrupted. false = every request alike
engine.priority-order=true
# memory (MB) for the token ids of recently rendered chat prompts: a request that resends a conversation seen before
# (every request of a coding agent does) tokenizes only the messages that are new; the ids are exactly those of a
# full tokenization (docs/17 section 17.5). About 4 bytes per prompt token; 0 = off (tokenize every prompt in full)
engine.prompt-cache-mb=64
# tool calls (the "tools" of /v1/chat/completions in jllm-web) are constrained (docs/17 section 17.7): once the model
# writes <tool_call> the call can only be {"name": <one of the tools>, "arguments": <an object matching its schema>}
# and ends with </tool_call>, so it always parses. false = tool calls are free text that is parsed afterwards, and
# "response_format" cannot be combined with "tools"
engine.constrained-tools=true
# text that a constraint (tool calls, response_format) forces - the fixed parts of a call, a closing brace - is
# appended without sampling and runs through the model in one pass with the token before it. false = every token is
# sampled and takes a pass of its own
engine.jump-forward=true
# constraints compute which tokens are allowed by walking a byte trie of the vocabulary and memoize the result per
# automaton state, instead of testing the most likely tokens one by one and then the whole vocabulary.
# false = the per-token tests only (slower where the model's favourite tokens are not allowed, the output is the same)
engine.constraint-masks=true
# speculative decoding: several tokens per pass over the target model's weights (docs/10 section 10.9).
#   off    one token per pass
#   ngram  prompt lookup: the tokens that followed the latest earlier occurrence of the text's last few tokens
#          (in prompt and output) are proposed and verified in one pass; no second model, nothing to load. The
#          default: coding agents and chats about code keep repeating text that is already in the context (a file
#          being edited, earlier tool calls), and a pass that drafts nothing costs nothing. Lookups pause on their own
#          while the measured acceptance and the measured cost of a verification pass say that no draft pays (free
#          text, the CPU backends' slow multi-token pass, the experts a mixture-of-experts model reads for every
#          drafted position; -Djllm.engine.adaptiveNgram=false drafts at every match). On by default for every model
#          since docs/11 section 11.10 measured it on agent-like prompts
#   draft  a small model of the same tokenizer (engine.draft-model) proposes the tokens
#   mtp    the model's own multi-token-prediction head (a Qwen3.5 GGUF with a nextn layer; docs/10 section 10.9, docs/16
#          section 16.14) proposes the token after the one just chosen; one extra transformer layer per token. The
#          only mode a hybrid (Gated DeltaNet) model can use: its state is checkpointed around each verification pass
# Greedy output equals "off"; sampled output has the same distribution (rejection sampling). Ignored for
# Mamba models (their state cannot be rolled back). Drafted/accepted counts are reported in the API usage.
engine.speculative=ngram
# draft mode: Hub repo of the draft model, kept in model.dir; it must share the target's tokenizer
# (e.g. Qwen/Qwen3-0.6B for Qwen/Qwen3-30B-A3B-Thinking-2507). It uses backend, backend.ctx and model.quant.
engine.draft-model=
# most tokens proposed per verification pass (the pass costs about that many extra tokens of compute); the
# number actually drafted adapts: it doubles while whole drafts are accepted and drops to what was accepted otherwise
engine.draft-tokens=16
# ngram mode: the text's suffix looked up is at most engine.ngram-max (<= 16) and at least engine.ngram-min tokens
# long (longest match wins, ties go to the most recent); every n-gram of the text is in a hash index, so the whole
# context is searched in constant time; engine.ngram-window > 0 limits copying to the last that many tokens
engine.ngram-max=8
engine.ngram-min=3
engine.ngram-window=0

# ---------------------------------------------------------------- bench
bench.max-tokens=128
bench.rounds=3
# the bench prompt repeats one 10-word sentence this many times: 40 = ~413 tokens, 200 = ~2 000 (long-prompt prefill)
bench.prompt-repeat=40

# ---------------------------------------------------------------- hugging face hub
# empty = https://huggingface.co (env HF_ENDPOINT also works)
hub.endpoint=
# empty = env HF_TOKEN / HUGGING_FACE_HUB_TOKEN / ~/.cache/huggingface/token
hub.token=
# response/read timeout for Hub requests
hub.timeout-ms=60000

# ---------------------------------------------------------------- audio (speech-to-text, text-to-speech; docs/21)
# Whisper (speech-to-text): cpu | metal | auto (metal when the GPU library is there, unless backend=cpu)
audio.backend=auto
# Whisper on Metal: whether the decoder runs on the GPU as well as the encoder. auto = when the model is at least 768 wide
# (small and up; for tiny and base a decoding step needs more GPU dispatches than the CPU needs time), on, off
audio.metal.decoder=auto
# CPU threads of the audio models, 0 = backend.threads (and that 0 = all processors)
audio.threads=0
# heap budget (MB) for a Whisper model's weights as floats; a bigger model (large-v3-turbo as f16 is 1.6 GB on disk, 3.2 GB
# as floats) stays memory-mapped and is converted per use
audio.resident-mb=1500
# ffmpeg, for audio formats other than WAV / AIFF / AU (MP3, FLAC, Ogg, M4A, WebM) and for mp3 / opus / aac / flac speech:
# auto = look it up on the PATH, off = never run it, or the path of the executable
audio.ffmpeg=auto
# longest audio accepted for transcription, in seconds
audio.max-seconds=3600
# largest audio upload of /v1/audio/transcriptions, in MB (the API server raises its request limit to this for audio)
audio.max-upload-mb=100
# longest text of one /v1/audio/speech request, in characters (longer is a 400; shorter text is read in pieces of about 220 characters)
audio.tts.max-chars=4096
# speech model loaded by `serve` at start (a Hugging Face repository or a folder name under model.dir); empty = none
audio.tts-model=
# speech-to-text model loaded by `serve` at start; empty = none
audio.stt-model=
# the speech codec (WavTokenizer) GGUF used by text-to-speech models: repository and file
audio.codec-repo=ggml-org/WavTokenizer
audio.codec-file=WavTokenizer-Large-75-F16.gguf
# weight quantization of the text-to-speech language model: q8 (Q8_0, the default: speech quality suffers visibly at 4 bits
# for a 0.5B model) | q4 | q2k | q6k, see model.quant
audio.tts.quant=q8
# context length of the text-to-speech language model (the speaker's reference audio costs about a thousand tokens and
# every second of speech 75 more)
audio.tts.ctx=8192
# language model sampling of text-to-speech: temperature, top-k, top-p, repetition penalty (Hugging Face style, over the prompt and the output)
audio.tts.temperature=0.1
audio.tts.top-k=40
audio.tts.top-p=0.9
audio.tts.repetition-penalty=1.1
# the voice used when a request names none (one of the shipped voices: en_male_1, en_female_1, en_male_2, en_male_3, de_male_1,
# de_male_2, fr_female_1, fr_female_2, fr_male_1, fr_male_2)
audio.tts.voice=en_male_1
# cut the silence OuteTTS puts around its speech (about half a second before it, a start-up click of the codec, a tail after it),
# keeping 0.12 s before and 0.2 s after
audio.tts.trim-silence=true
# speech-to-text: retry a window that decodes badly at higher temperatures; condition each window on the previous text
audio.stt.fallback=true
audio.stt.condition-on-previous=true
# ---------------------------------------------------------------- image generation (docs/22)
# Stable Diffusion models in the diffusers layout (SD 1.x, SD 2.x / SD-Turbo, SDXL / SDXL-Turbo): text to image, image to
# image and inpainting on /v1/images/generations and /v1/images/edits, and the "jllm image" command.
# The model "jllm serve" adds to its API: a Hub repo such as stabilityai/sd-turbo (downloaded into model.dir) or a local
# folder; empty = none. Start with --model none to serve only images.
image.model=
# where the networks run: auto = Metal when there is a GPU, else the CPU (float32, slow); metal; cpu
image.backend=auto
# storage of weights and activations on the GPU: auto = f16 (arithmetic is f32 either way; the VAE of an SDXL-type model
# always runs in f32, it overflows in f16); f16; f32
image.precision=auto
# images larger than this many latent pixels (8 image pixels each) per side are decoded / encoded by the VAE in tiles,
# which bounds its memory (128 = up to 1024x1024 in one piece, about 3 GB; use 64 on a small machine); the tiles overlap by
# image.vae-tile-overlap latent pixels and are blended. A tiled result differs slightly from the whole decode (the group
# norms see one tile: about 3% in brightness)
image.vae-tile=128
image.vae-tile-overlap=8

# the "jllm image" command (one picture, or --image.count of them, from the command line; --prompt is the text):
# 0 / -1 / empty = the model's own recommendation (SD-Turbo: 1 step, no guidance, 512x512)
image.steps=0
image.guidance=-1
image.width=0
image.height=0
image.seed=-1
image.scheduler=
image.negative=
image.count=1
image.out=image.png
# an input picture (and optionally a mask: white = repaint) for image-to-image / inpainting, and how much of it is redrawn (0..1)
image.init=
image.mask=
image.strength=0.8
